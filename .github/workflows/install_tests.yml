name: install tests
on: [pull_request, push]
jobs:
  install-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A script that does not parse is a broken install nobody finds until a cluster runs it.
      - name: every shell script parses
        run: |
          fail=0
          for f in $(git ls-files '*.sh' '*.slurm'); do bash -n "$f" || fail=1; done
          exit $fail
      # Globbed, like the parse step above: a new tests/*.sh is run without editing this file.
      - name: shell tests
        run: |
          for f in tests/*.sh; do echo "== $f"; bash "$f"; done
