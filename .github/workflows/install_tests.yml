name: install tests
on: [pull_request, push]
jobs:
  install-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backends/openfold
    steps:
      - uses: actions/checkout@v7
      # A script that does not parse is a broken install nobody finds until a cluster runs it.
      - name: every shell script parses
        working-directory: .
        run: |
          fail=0
          for f in $(git ls-files '*.sh' '*.slurm'); do bash -n "$f" || fail=1; done
          exit $fail
      - run: bash install/tests/launch_args.sh
      - run: bash install/tests/site_config.sh
      - run: bash install/tests/vocabulary.sh
