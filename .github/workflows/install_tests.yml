name: install tests
on: [pull_request, push]
jobs:
  install-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A script that does not parse is a broken install nobody finds until a cluster runs it.
      - name: every shell script parses
        run: |
          fail=0
          for f in $(git ls-files '*.sh' '*.slurm'); do bash -n "$f" || fail=1; done
          exit $fail
      - run: bash tests/launch_args.sh
      - run: bash tests/site_config.sh
      - run: bash tests/vocabulary.sh
      - run: bash tests/link_mirror.sh
      - run: bash tests/esmfold_env.sh
      - run: bash tests/install_rc.sh
      - run: bash tests/configure_repo.sh
      - run: bash tests/libcuda_stub.sh
      - run: bash tests/slurm_account.sh
