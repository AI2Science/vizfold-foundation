[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "esmfold"
version = "0.1.0"
description = "ESMFold backend for vizfold: HuggingFace EsmForProteinFolding with attention/activation tracing."
requires-python = ">=3.10"
license = { text = "Apache License, Version 2.0" }
# torch is declared but environment.yml resolves it against the host's GPU driver first: pip then
# finds the requirement satisfied and leaves that build in place.
dependencies = [
    "torch>=2.1",
    "transformers>=4.36.0,<5.0.0",
    "numpy>=1.24",
]

# The backend's own CLI, also reachable as `python -m esmfold`.
[project.scripts]
esmfold = "esmfold.cli:main"

[tool.setuptools.packages.find]
namespaces = false
include = ["esmfold*"]
